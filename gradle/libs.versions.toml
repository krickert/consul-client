[versions]
apache-commons = "3.13.0"
commons-codec = "1.16.0"
findbugs = "3.0.2"
guava = "32.1.3-jre"
immutables = "2.10.1"
jackson = "2.15.3"
junit = "4.13.2"
junitparams = "1.1.1"
mockito = "3.12.4"
retrofit = "2.9.0"
okhttp = "4.12.0"
slf4j = "2.0.9"
logback = "1.4.11"
testcontainers = "1.19.1"

[libraries]
# Main dependencies
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-jackson = { module = "com.squareup.retrofit2:converter-jackson", version.ref = "retrofit" }
retrofit-mock = { module = "com.squareup.retrofit2:retrofit-mock", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
findbugs-jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "findbugs" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
jackson-datatype-guava = { module = "com.fasterxml.jackson.datatype:jackson-datatype-guava", version.ref = "jackson" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "apache-commons" }
immutables-value = { module = "org.immutables:value", version.ref = "immutables" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Test dependencies
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
junitparams = { module = "pl.pragmatists:JUnitParams", version.ref = "junitparams" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commons-codec" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
[bundles]
jackson = ["jackson-annotations", "jackson-core", "jackson-databind", "jackson-datatype-jdk8", "jackson-datatype-guava"]
